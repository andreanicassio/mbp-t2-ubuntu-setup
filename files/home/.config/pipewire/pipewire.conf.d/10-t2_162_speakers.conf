              "Release time 0 (ms)": 100,
              "Knee 0 (G)": 0.125,
              "Compression band enable 1": 1,
              "Split frequency 1 (Hz)": 250.0,
              "Compressor enable 1": 0,
              "Compression band enable 2": 0,
              "Compressor enable 2": 0,
              "Compression band enable 3": 0,
              "Compressor enable 3": 0,
              "Compression band enable 4": 0,
              "Compressor enable 4": 0,
              "Compression band enable 5": 0,
              "Compressor enable 5": 0,
              "Compression band enable 6": 0,
              "Compressor enable 6": 0
