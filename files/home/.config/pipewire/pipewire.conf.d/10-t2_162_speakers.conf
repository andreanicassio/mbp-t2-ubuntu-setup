          {
            "output": "rwoofer_bp:Output L",
            "input": "rwoofer_lim:Input L"
          },
          {
            "output": "rwoofer_bp:Output R",
            "input": "rwoofer_lim:Input R"
          }
        ],
        "inputs": [
          "ell:Input",
          "elr:Input"
        ],
        "outputs": [
          "fwoofer_lim:Output L",
          "fwoofer_lim:Output R",
          "rwoofer_lim:Output L",
          "rwoofer_lim:Output R"
        ],
        "capture.volumes": [
          {
            "control": "ell:Output volume (dB)",
            "min": -42.5,
            "max": 0.0,
            "scale": "cubic"
          },
          {
            "control": "elr:Output volume (dB)",
            "min": -42.5,
            "max": 0.0,
            "scale": "cubic"
          }
        ]
