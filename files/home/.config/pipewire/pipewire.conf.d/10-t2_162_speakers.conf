                "/usr/share/t2linux-audio/16_2/rear-48.wav",
                "/usr/share/t2linux-audio/16_2/rear-96.wav",
                "/usr/share/t2linux-audio/16_2/rear-192.wav"
              ],
              "channel": 0,
              "gain": 0.92
            }
          },
          {
            "type": "ladspa",
            "plugin": "lsp-plugins-ladspa",
            "label": "http://lsp-plug.in/plugins/ladspa/mb_compressor_stereo",
            "name": "fwoofer_bp",
            "control": {
              "Compressor mode": 0,
              "Compressor enable 0": 1,
              "Sidechain lookahead 0 (ms)": 5.0,
              "Ratio 0": 1.75,
              "Attack threshold 0 (G)": 0.625,
              "Attack time 0 (ms)": 1.0,
              "Release time 0 (ms)": 100,
              "Knee 0 (G)": 0.125,
              "Compression band enable 1": 1,
              "Split frequency 1 (Hz)": 250.0,
              "Compressor enable 1": 0,
              "Compression band enable 2": 0,
              "Compressor enable 2": 0,
              "Compression band enable 3": 0,
              "Compressor enable 3": 0,
              "Compression band enable 4": 0,
              "Compressor enable 4": 0,
              "Compression band enable 5": 0,
              "Compressor enable 5": 0,
              "Compression band enable 6": 0,
              "Compressor enable 6": 0
            }
          },
          {
            "type": "ladspa",
            "plugin": "lsp-plugins-ladspa",
            "label": "http://lsp-plug.in/plugins/ladspa/compressor_stereo",
            "name": "fwoofer_lim",
            "control": {
              "Sidechain lookahead (ms)": 5.0,
              "Attack threshold (G)": 1.0,
              "Attack time (ms)": 1.0,
