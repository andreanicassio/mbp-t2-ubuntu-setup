        "links": [
          {
            "output": "ell:Output",
            "input": "convFL:In"
          },
          {
            "output": "elr:Output",
            "input": "convFR:In"
          },
          {
            "output": "ell:Output",
            "input": "convRL:In"
          },
          {
            "output": "elr:Output",
            "input": "convRR:In"
          },
          {
            "output": "convFL:Out",
