      "capture.props": {
        "node.name": "audio_effect.t2-162-speakers",
        "media.class": "Audio/Sink",
        "audio.channels": "2",
        "audio.position": [
          "FL",
          "FR"
        ],
        "audio.allowed-rates": [
          96000,
          88200,
          48000,
          44100
        ],
        "device.api": "dsp",
        "node.virtual": "false",
        "priority.session": 1500,
        "state.default-volume": 0.343,
        "device.icon-name": "audio-speakers",
        "node.description": "MacBook Pro T2 DSP Speakers"
      },
      "playback.props": {
        "node.name": "effect_output.t2-162-speakers",
        "node.description": "MacBook Pro 16,2 DSP Speakers Out",
        "media.name": "MacBook Pro 16,2 DSP Speakers Out",
        "target.object": "alsa_output.pci-0000_e6_00.3.Speakers",
        "node.dont-fallback": "true",
        "node.passive": "true",
        "audio.channels": "4",
        "audio.allowed-rates": [
          96000,
          88200,
          48000,
          44100
        ],
        "audio.position": [
          "FL",
          "FR",
          "RL",
          "RR"
