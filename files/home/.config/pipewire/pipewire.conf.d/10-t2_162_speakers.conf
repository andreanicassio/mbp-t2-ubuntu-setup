# T2 DSP speakers: lemmyg/t2-apple-audio-dsp 16_2 graph (Asahi-derived) translated to LADSPA for PipeWire 1.0.5
# (no LV2 in Ubuntu 24.04's filter-chain). bankstown bass enhancer omitted (LV2-only). Remove this file to revert.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      "node.description": "MacBook Pro T2 DSP Speakers",
      "media.name": "MacBook Pro T2 DSP Speakers",
      "filter.graph": {
        "nodes": [
