            }
          },
          {
            "type": "builtin",
            "label": "convolver",
            "name": "convFR",
            "config": {
              "filename": [
                "/usr/share/t2linux-audio/16_2/front-44.wav",
                "/usr/share/t2linux-audio/16_2/front-48.wav",
                "/usr/share/t2linux-audio/16_2/front-96.wav",
                "/usr/share/t2linux-audio/16_2/front-192.wav"
              ],
              "channel": 0,
              "gain": 0.92
            }
          },
          {
            "type": "builtin",
            "label": "convolver",
            "name": "convRL",
            "config": {
              "filename": [
                "/usr/share/t2linux-audio/16_2/rear-44.wav",
                "/usr/share/t2linux-audio/16_2/rear-48.wav",
                "/usr/share/t2linux-audio/16_2/rear-96.wav",
