            "type": "ladspa",
            "plugin": "lsp-plugins-ladspa",
            "label": "http://lsp-plug.in/plugins/ladspa/loud_comp_mono",
            "name": "ell",
            "control": {
              "Input gain (G)": 1.0,
              "FFT size": 2,
              "Bypass": 0
            }
          },
          {
            "type": "ladspa",
            "plugin": "lsp-plugins-ladspa",
            "label": "http://lsp-plug.in/plugins/ladspa/loud_comp_mono",
            "name": "elr",
            "control": {
              "Input gain (G)": 1.0,
              "FFT size": 2,
              "Bypass": 0
            }
          },
          {
            "type": "builtin",
            "label": "convolver",
            "name": "convFL",
            "config": {
              "filename": [
                "/usr/share/t2linux-audio/16_2/front-44.wav",
                "/usr/share/t2linux-audio/16_2/front-48.wav",
                "/usr/share/t2linux-audio/16_2/front-96.wav",
                "/usr/share/t2linux-audio/16_2/front-192.wav"
              ],
              "channel": 0,
